name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        # هذا هو السطر السحري للقوالب التي تحتوي على ملفات gradle
        uses: recloudstream/gradle-main-action@master
        with:
          # هذا سيقوم ببناء جميع الإضافات الموجودة في المستودع
          command: make
