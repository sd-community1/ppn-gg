name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # هذا السطر سيسمح لك بتشغيل البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build JS Plugin
        uses: recloudstream/cloudstream-archive-action@master
        with:
          is-js-repo: true
