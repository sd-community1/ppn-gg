name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # سنستخدم الأمر المباشر الموجود داخل القالب بدلاً من أداة خارجية
        run: ./gradlew make

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # المجلد الناتج بعد البناء
          branch: builds # الفرع الذي سيتم رفع الإضافة إليه
